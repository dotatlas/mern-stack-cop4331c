info:
  name: Get My Account
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseURL}}/api/users/{{userId}}"
  auth:
    type: bearer
    token: "{{token}}"

runtime:
  scripts:
    - type: tests
      code: |-
        const body = res.getBody();

        test("responds 200 OK", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("returns the logged-in user", function () {
          expect(body._id).to.equal(bru.getVar("userId"));
          expect(body.email).to.equal(bru.getEnvVar("email"));
        });

        test("never returns the password hash", function () {
          expect(body).to.not.have.property("passwordHash");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  A protected route: needs the token saved by Login.
