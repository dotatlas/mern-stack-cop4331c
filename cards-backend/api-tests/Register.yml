info:
  name: Register
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseURL}}/api/users"
  body:
    type: json
    data: |-
      {
        "firstName": "Test",
        "lastName": "Student",
        "email": "{{newEmail}}",
        "password": "{{newPassword}}",
        "isVerified": true
      }
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        // Registering the same email twice returns 409, so make each run unique
        bru.setVar("newEmail", `student${Date.now()}@example.com`);
        bru.setVar("newPassword", "Passw0rd!");
    - type: tests
      code: |-
        const body = res.getBody();

        test("responds 201 Created", function () {
          expect(res.getStatus()).to.equal(201);
        });

        test("returns a token and the new user", function () {
          expect(body.token).to.be.a("string");
          expect(body.user.email).to.equal(bru.getVar("newEmail"));
        });

        test("never returns the password hash", function () {
          expect(body.user).to.not.have.property("passwordHash");
        });

        test("starts unverified, even if the client says otherwise", function () {
          expect(body.user.isVerified).to.equal(false);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Creates a new account. Does not change the logged-in user for the requests that follow.
