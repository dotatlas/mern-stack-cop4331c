services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mern_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=development
      - MONGODB_URI=mongodb://mongodb:27017/CalendarDB
      # Read from the .env file next to this one (copy .env.example to .env)
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in .env - see .env.example}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-1h}
      - DB_ENCRYPTION_KEY=${DB_ENCRYPTION_KEY:?Set DB_ENCRYPTION_KEY in .env - see .env.example}
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    command: npm run dev
    depends_on:
      mongodb:
        condition: service_healthy

  mongodb:
    image: docker.io/mongo:7.0
    container_name: mern_mongodb
    restart: unless-stopped
    # Reachable only from this machine (for tools like MongoDB Compass).
    # Without 127.0.0.1, Docker would publish the database to the whole
    # internet on a server, bypassing the firewall.
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  mongo_data:
